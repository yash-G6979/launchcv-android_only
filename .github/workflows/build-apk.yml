
name: Build LaunchCV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip launchcv-android_only/LaunchCV_Android_Project.zip
          cd LaunchCV_Android
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LaunchCV-debug-apk
          path: LaunchCV_Android/app/build/outputs/apk/debug/app-debug.apk
          
